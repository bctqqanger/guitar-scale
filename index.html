<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C 大调第一把位 · 随机简谱</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#15110d;
    --ink:#f6ecdd;
    --dim:#a8937c;
    --accent:#f4b942;
  }
  body{
    font-family:'Noto Sans SC',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1000px 500px at 50% 30%, rgba(244,185,66,.12), transparent 60%),
      linear-gradient(180deg,#241711,var(--bg) 60%);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;
  }

  .note{
    width:min(72vmin,360px);height:min(72vmin,360px);border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 38% 30%, #ffd877, var(--accent) 58%, #c8821f);
    color:#2a1809;
    box-shadow:0 20px 60px rgba(244,185,66,.3), inset 0 4px 10px rgba(255,255,255,.45), inset 0 -10px 26px rgba(0,0,0,.22);
    user-select:none;cursor:pointer;
  }
  .num-wrap{position:relative;display:flex;align-items:center;justify-content:center;line-height:.85}
  .note .num{
    font-family:'Fraunces',serif;font-weight:900;
    font-size:min(42vmin,210px);line-height:.85;
  }
  .oct-dot{
    position:absolute;left:50%;transform:translateX(-50%);
    width:min(4vmin,16px);height:min(4vmin,16px);border-radius:50%;
    background:#2a1809;
  }
  .oct-dot.top{top:calc(-1 * min(4.5vmin,18px))}
  .oct-dot.bot{bottom:calc(-1 * min(4.5vmin,18px))}
  .note .solf{font-size:min(4.5vmin,20px);font-weight:700;letter-spacing:.1em;margin-top:32px;opacity:.8}
  .note.flash{animation:flash .35s ease}
  @keyframes flash{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}

  .next-btn{
    font-family:inherit;font-weight:700;font-size:15px;color:#2a1809;cursor:pointer;
    background:linear-gradient(180deg,#ffd06a,#e89225);border:0;padding:13px 34px;border-radius:999px;
    box-shadow:0 8px 20px rgba(244,185,66,.28);transition:.18s;margin-top:40px;
  }
  .next-btn:hover{transform:translateY(-2px);box-shadow:0 11px 26px rgba(244,185,66,.4)}

  .extra{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap;justify-content:center}
  .auto-btn{
    font-family:inherit;font-weight:600;font-size:13px;color:var(--ink);cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid rgba(244,185,66,.28);padding:9px 16px;border-radius:999px;transition:.18s;
  }
  .auto-btn:hover{background:rgba(244,185,66,.1)}
  .auto-btn.on{color:var(--accent);border-color:rgba(244,185,66,.5)}
  .speed{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:12.5px}
  .speed input{accent-color:var(--accent);cursor:pointer;width:90px}

  .hint{color:var(--dim);font-size:12px;text-align:center;margin-top:18px;opacity:.7}
  .hint b{color:var(--ink)}

  /* 指板图 */
  .fretboard-overlay{
    position:fixed;right:20px;top:20px;
    --dx:0px;--dy:0px;
    transform:translate(var(--dx),var(--dy)) scale(.92);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    z-index:50;transform-origin:top right;touch-action:none;
  }
  .fretboard-overlay.show{opacity:1;pointer-events:auto;transform:translate(var(--dx),var(--dy)) scale(1)}
  @media (max-width:560px){
    .fretboard-overlay{transform:translate(var(--dx),var(--dy)) scale(.6)}
    .fretboard-overlay.show{transform:translate(var(--dx),var(--dy)) scale(.6)}
  }
  .fb{
    background:linear-gradient(180deg,#3a2410,#2a1808);
    border-radius:10px;padding:12px 10px 10px;
    box-shadow:0 12px 36px rgba(0,0,0,.6), inset 0 1px 2px rgba(255,220,170,.1);
  }
  .fb-row{position:relative;display:flex;height:30px;align-items:stretch}
  .fb-row::before{
    content:"";position:absolute;left:0;right:0;top:50%;height:var(--th,2px);transform:translateY(-50%);
    background:linear-gradient(180deg,#d8d8de,#9a9aa2 50%,#c4c4cc);border-radius:1px;z-index:1;
  }
  .fb-cell{width:46px;position:relative;display:flex;align-items:center;justify-content:center;z-index:2}
  .fb-cell.open{width:38px}
  .fb-cell::after{
    content:"";position:absolute;right:0;top:-4px;bottom:-4px;width:2px;
    background:linear-gradient(90deg,#8a8a90,#dadae0 50%,#76767c);border-radius:1px;
  }
  .fb-cell.open::after{width:5px;background:linear-gradient(90deg,#bfb090,#f0e6cc 50%,#bfb090)}
  .fb-cell.extend{width:46px}
  .fb-cell.extend::after{display:none}
  .fb-mark{
    width:24px;height:24px;border-radius:50%;
    background:radial-gradient(circle at 38% 30%,#ffd877,var(--accent) 60%,#c8821f);
    color:#2a1809;font-family:'Fraunces',serif;font-weight:900;font-size:13px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 0 rgba(244,185,66,.5),0 2px 6px rgba(0,0,0,.4);
    animation:pulse 1.1s ease-in-out infinite;
  }
  .fb-mark .mk{position:relative;display:inline-block;line-height:1;padding:3px 0}
  .fb-mark .mk .d{position:absolute;left:50%;transform:translateX(-50%);width:3px;height:3px;border-radius:50%;background:#2a1809}
  .fb-mark .mk .d.up{top:-1px}
  .fb-mark .mk .d.dn{bottom:-1px}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(244,185,66,.45),0 2px 6px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 8px rgba(244,185,66,0),0 2px 8px rgba(0,0,0,.4)}}
  .fb-labels{position:absolute;left:-22px;top:12px;display:flex;flex-direction:column}
  .fb-labels span{height:30px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);font-weight:700;width:18px}
  .fb-frets{display:flex;margin-top:4px;padding-left:38px}
  .fb-frets span{width:46px;text-align:center;font-size:9px;color:var(--dim)}
  .fb-title{text-align:center;font-size:11px;color:var(--dim);margin-bottom:6px;letter-spacing:.06em}
</style>
</head>
<body>
  <div class="note" id="note" title="点击或按空格换下一个">
    <div class="num-wrap" id="numWrap">
      <span class="oct-dot top" id="dotTop" style="display:none"></span>
      <div class="num" id="num">1</div>
      <span class="oct-dot bot" id="dotBot" style="display:none"></span>
    </div>
    <div class="solf" id="solf">Do</div>
  </div>

  <button class="next-btn" id="nextBtn">下一个 →</button>

  <div class="extra">
    <button class="auto-btn on" id="soundBtn">🔇 静音</button>
    <button class="auto-btn" id="autoBtn">自动播放</button>
    <button class="auto-btn" id="fretBtn">指板</button>
    <div class="speed">
      间隔
      <input type="range" id="interval" min="1" max="10" step="0.5" value="2">
      <span id="intervalVal">2.0s</span>
    </div>
  </div>

  <p class="hint"><b>Enter</b> 下一个音　<b>空格</b> 自动播放/停止　<b>↑↓</b> 调间隔　<b>V</b> 开关声音　<b>P</b> 显示/关闭指板</p>

  <div class="fretboard-overlay" id="fretOverlay">
    <div class="fb">
      <div class="fb-title">指板位置</div>
      <div class="fb-labels"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
      <div id="fbGrid"></div>
      <div class="fb-frets"><span>1</span><span>2</span><span>3</span></div>
    </div>
  </div>

<script>
  // C 大调第一把位（0~4品）全部音，按音高从低到高
  // oct: low=低音(下点) mid=中音(无点) high=高音(上点)
  // freq: 实际音高频率(Hz)，用于发声
  // pos: 指板位置 [弦号(1高音E~6低音E), 品位(0=空弦)]
  const scale = [
    {num:'3', oct:'low',  solf:'Mi',  name:'E', freq:164.81, pos:[6,0]},   // E3 低音Mi（6弦空弦）
    {num:'4', oct:'low',  solf:'Fa',  name:'F', freq:174.61, pos:[6,1]},   // F3 低音Fa（6弦1品）
    {num:'5', oct:'low',  solf:'Sol', name:'G', freq:196.00, pos:[6,3]},   // G3 低音Sol（6弦3品）
    {num:'6', oct:'low',  solf:'La',  name:'A', freq:220.00, pos:[5,0]},   // A3 低音La
    {num:'7', oct:'low',  solf:'Si',  name:'B', freq:246.94, pos:[5,2]},   // B3 低音Si
    {num:'1', oct:'mid',  solf:'Do',  name:'C', freq:261.63, pos:[5,3]},   // C4 中音Do
    {num:'2', oct:'mid',  solf:'Re',  name:'D', freq:293.66, pos:[4,0]},   // D4 中音Re
    {num:'3', oct:'mid',  solf:'Mi',  name:'E', freq:329.63, pos:[4,2]},   // E4 中音Mi
    {num:'4', oct:'mid',  solf:'Fa',  name:'F', freq:349.23, pos:[4,3]},   // F4 中音Fa
    {num:'5', oct:'mid',  solf:'Sol', name:'G', freq:392.00, pos:[3,0]},   // G4 中音Sol
    {num:'6', oct:'mid',  solf:'La',  name:'A', freq:440.00, pos:[3,2]},   // A4 中音La
    {num:'7', oct:'mid',  solf:'Si',  name:'B', freq:493.88, pos:[2,0]},   // B4 中音Si
    {num:'1', oct:'high', solf:'Do',  name:'C', freq:523.25, pos:[2,1]},   // C5 高音Do
    {num:'2', oct:'high', solf:'Re',  name:'D', freq:587.33, pos:[2,3]},   // D5 高音Re
    {num:'3', oct:'high', solf:'Mi',  name:'E', freq:659.25, pos:[1,0]},   // E5 高音Mi
    {num:'4', oct:'high', solf:'Fa',  name:'F', freq:698.46, pos:[1,1]},   // F5 高音Fa
    {num:'5', oct:'high', solf:'Sol', name:'G', freq:783.99, pos:[1,3]},   // G5 高音Sol
  ];

  const numEl=document.getElementById('num');
  const solfEl=document.getElementById('solf');
  const noteEl=document.getElementById('note');
  const dotTop=document.getElementById('dotTop');
  const dotBot=document.getElementById('dotBot');
  const nextBtn=document.getElementById('nextBtn');
  const autoBtn=document.getElementById('autoBtn');
  const soundBtn=document.getElementById('soundBtn');
  const interval=document.getElementById('interval');
  const intervalVal=document.getElementById('intervalVal');
  const fretOverlay=document.getElementById('fretOverlay');
  const fbGrid=document.getElementById('fbGrid');

  let last=null, autoTimer=null;
  let soundOn=true;
  let fretVisible=false;

  // —— 构建指板图 ——
  const strThick={1:1.5,2:1.8,3:2.2,4:2.6,5:3.0,6:3.4};
  function buildFretboard(){
    fbGrid.innerHTML='';
    for(let s=1;s<=6;s++){
      const row=document.createElement('div');
      row.className='fb-row';
      row.style.setProperty('--th',strThick[s]+'px');
      for(let f=0;f<=3;f++){
        const cell=document.createElement('div');
        cell.className='fb-cell'+(f===0?' open':'');
        cell.dataset.string=s;cell.dataset.fret=f;
        row.appendChild(cell);
      }
      // 三品后的延伸（仅琴弦，无品丝）
      const ext=document.createElement('div');
      ext.className='fb-cell extend';
      row.appendChild(ext);
      fbGrid.appendChild(row);
    }
  }
  function updateFretMark(item){
    fbGrid.querySelectorAll('.fb-mark').forEach(m=>m.remove());
    if(!item) return;
    const [s,f]=item.pos;
    const cell=fbGrid.querySelector(`.fb-cell[data-string="${s}"][data-fret="${f}"]`);
    if(cell){
      const mark=document.createElement('div');
      mark.className='fb-mark';
      const mk=document.createElement('span');
      mk.className='mk';
      if(item.oct==='high'){const d=document.createElement('span');d.className='d up';mk.appendChild(d);}
      const n=document.createTextNode(item.num);
      if(item.oct==='high') mk.appendChild(n); else mk.insertBefore(n,mk.firstChild);
      if(item.oct==='low'){const d=document.createElement('span');d.className='d dn';mk.appendChild(d);}
      mark.appendChild(mk);
      cell.appendChild(mark);
    }
  }

  // —— Web Audio：用合成音色模拟吉他拨弦 ——
  let audioCtx=null, audioReady=false;
  function ensureAudio(){
    if(!audioCtx){ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }
    if(audioCtx.state==='suspended') audioCtx.resume();
    audioReady=true;
  }
  // 移动端音频解锁：AudioContext 必须在用户手势内激活，否则无声
  let pendingItem=null;
  function unlockOnce(){ ensureAudio(); if(pendingItem){ playTone(pendingItem.freq); pendingItem=null; } }
  ['touchstart','pointerdown','click'].forEach(ev=>document.addEventListener(ev,unlockOnce,{once:true}));
  // 拨弦音色：基音 + 几个泛音叠加，配合快速衰减的包络
  function playTone(freq){
    if(!soundOn) return;
    // 未解锁（移动端首次自动播放）暂存，等用户首次触摸后补播
    if(!audioReady){ pendingItem={freq}; return; }
    ensureAudio();
    const ctx=audioCtx, now=ctx.currentTime, dur=1.8;
    const master=ctx.createGain();
    master.connect(ctx.destination);
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(0.32, now+0.008); // 快速起音
    master.gain.exponentialRampToValueAtTime(0.001, now+dur); // 自然衰减

    // 泛音层（模拟弦的音色）
    const harmonics=[
      {f:1.0, g:1.0,  type:'triangle'},
      {f:2.0, g:0.45, type:'sine'},
      {f:3.0, g:0.22, type:'sine'},
      {f:4.0, g:0.12, type:'sine'},
    ];
    harmonics.forEach(h=>{
      const osc=ctx.createOscillator();
      osc.type=h.type;
      osc.frequency.value=freq*h.f;
      const g=ctx.createGain(); g.gain.value=h.g;
      osc.connect(g); g.connect(master);
      osc.start(now); osc.stop(now+dur);
    });
  }

  function pick(){
    let x;
    do{ x=Math.floor(Math.random()*scale.length); }while(scale.length>1 && x===last);
    last=x;
    const item=scale[x];
    numEl.textContent=item.num;
    solfEl.textContent=item.solf;
    dotTop.style.display = item.oct==='high'?'block':'none';
    dotBot.style.display = item.oct==='low'?'block':'none';
    noteEl.classList.remove('flash');void noteEl.offsetWidth;noteEl.classList.add('flash');
    playTone(item.freq);
    updateFretMark(item);
  }

  nextBtn.addEventListener('click',pick);
  noteEl.addEventListener('click',pick);

  soundBtn.addEventListener('click',()=>{
    soundOn=!soundOn;
    soundBtn.textContent = soundOn?'🔇 静音':'🔊 发声';
    soundBtn.classList.toggle('on',soundOn);
    if(soundOn) ensureAudio();
  });

  function startAuto(){
    autoBtn.textContent='停止';autoBtn.classList.add('on');
    run();
    function run(){
      pick();
      autoTimer=setTimeout(run, parseFloat(interval.value)*1000);
    }
  }
  function stopAuto(){
    clearTimeout(autoTimer);autoTimer=null;
    autoBtn.textContent='自动播放';autoBtn.classList.remove('on');
  }
  autoBtn.addEventListener('click',()=>{ autoTimer?stopAuto():startAuto(); });

  const fretBtn=document.getElementById('fretBtn');
  fretBtn.addEventListener('click',()=>{
    fretVisible=!fretVisible;
    fretOverlay.classList.toggle('show',fretVisible);
    fretBtn.classList.toggle('on',fretVisible);
    fretBtn.textContent=fretVisible?'隐藏指板':'指板';
  });

  // —— 指板拖动（手机/鼠标通用） ——
  let dx=0, dy=0, dragging=false, sx=0, sy=0;
  fretOverlay.addEventListener('pointerdown',e=>{
    dragging=true; sx=e.clientX; sy=e.clientY;
    fretOverlay.setPointerCapture(e.pointerId);
    fretOverlay.style.transition='none';
  });
  fretOverlay.addEventListener('pointermove',e=>{
    if(!dragging) return;
    dx+=e.clientX-sx; dy+=e.clientY-sy;
    sx=e.clientX; sy=e.clientY;
    fretOverlay.style.setProperty('--dx',dx+'px');
    fretOverlay.style.setProperty('--dy',dy+'px');
  });
  const endDrag=()=>{ dragging=false; fretOverlay.style.transition=''; };
  fretOverlay.addEventListener('pointerup',endDrag);
  fretOverlay.addEventListener('pointercancel',endDrag);

  interval.addEventListener('input',()=>{
    intervalVal.textContent=parseFloat(interval.value).toFixed(1)+'s';
  });

  document.addEventListener('keydown',e=>{
    const k=e.key;
    if(k==='Enter'){ e.preventDefault(); pick(); }
    else if(k==='ArrowUp'){ e.preventDefault(); interval.value=Math.min(10,parseFloat(interval.value)+0.5).toFixed(1); interval.dispatchEvent(new Event('input')); }
    else if(k==='ArrowDown'){ e.preventDefault(); interval.value=Math.max(1,parseFloat(interval.value)-0.5).toFixed(1); interval.dispatchEvent(new Event('input')); }
    else if(k===' '){ e.preventDefault(); autoTimer?stopAuto():startAuto(); }
    else if(k==='v'||k==='V'){ soundBtn.click(); }
    else if(k==='p'||k==='P'){ fretBtn.click(); }
  });

  buildFretboard();
  pick();
</script>
</body>
</html>
